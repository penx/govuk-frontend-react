name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag, such as alpha for a prerelease
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm stage publish --access public --tag "$TAG"
        env:
          TAG: ${{ inputs.tag }}
