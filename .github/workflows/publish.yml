name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm stage publish --access public --tag "$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] ?? 'latest'")"
